services:
  pinsign:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinsign
    restart: unless-stopped
    ports:
      - "127.0.0.1:4183:4183"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4183
      PINSIGN_DATA_DIR: /app/data
      BASE_PATH: ${BASE_PATH:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - pinsign_data:/app/data

volumes:
  pinsign_data:
